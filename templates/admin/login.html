<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — لوحة التحكم</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, #1a5c64, #247680, #2a8f9e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      text-align: center;
    }
    .login-logo {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin: 0 auto 16px;
      object-fit: contain;
    }
    h1 { font-size: 1.4rem; font-weight: 800; color: #1a5c64; margin-bottom: 4px; }
    .subtitle { font-size: .85rem; color: #6b7c7e; margin-bottom: 28px; }
    .form-group { margin-bottom: 16px; text-align: right; }
    .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: .9rem; }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7c7e;
    }
    input {
      width: 100%;
      padding: 11px 40px 11px 12px;
      border: 1.5px solid #d4e4e6;
      border-radius: 10px;
      font-family: inherit;
      font-size: .95rem;
      transition: border-color .2s;
      text-align: right;
    }
    input:focus { outline: none; border-color: #247680; box-shadow: 0 0 0 3px rgba(36,118,128,.12); }
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #247680, #1a5c64);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 8px;
    }
    .btn-login:hover { opacity: .9; }
    .error-msg {
      background: #f8d7da;
      color: #842029;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: .88rem;
      font-weight: 600;
    }
    .back-link { margin-top: 16px; font-size: .85rem; }
    .back-link a { color: #247680; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-card">
    {% if config.LOGO_URL %}
    <img src="{{ config.LOGO_URL }}" class="login-logo" alt="Logo">
    {% else %}
    <div style="font-size:3rem;margin-bottom:12px">🏛️</div>
    {% endif %}
    <h1>{{ config.ORG_AR }}</h1>
    <div class="subtitle">لوحة تحكم — نظام الحجز</div>

    {% if error %}
    <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <div class="input-wrap">
          <i class="fas fa-user"></i>
          <input type="text" name="username" required autocomplete="username">
        </div>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>
    </form>
    <div class="back-link">
      <a href="/calendar">← الروزنامة العامة</a>
    </div>
  </div>
</body>
</html>
