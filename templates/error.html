{% set AR = (lang != 'en') %}
<!DOCTYPE html>
<html lang="{{ 'ar' if AR else 'en' }}" dir="{{ 'rtl' if AR else 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include '_head_assets.html' %}
  <title>{{ 'تنبيه' if AR else 'Notice' }} — {{ brand.org_ar if AR else brand.org_en }}</title>
</head>
<body class="auth">
<div class="auth-wrap"><div class="notice-box">
  <div class="ic"><i class="fas fa-circle-exclamation"></i></div>
  <div class="msg">{{ msg }}</div>
  <a class="btn btn-primary" href="/calendar?lang={{ 'ar' if AR else 'en' }}"><i class="fas fa-calendar-days"></i> {{ 'العودة إلى الروزنامة' if AR else 'Back to the calendar' }}</a>
</div></div>
<footer class="auth-foot">© {{ now_year }} <b>{{ brand.org_ar if AR else brand.org_en }}</b></footer>
</body>
</html>
