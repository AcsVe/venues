<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غير متصل بالإنترنت</title>
<style>
  body { font-family: Tajawal, Arial, sans-serif; background:#eef3f5; margin:0;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { background:#fff; border-radius:16px; padding:36px 28px; text-align:center; max-width:380px;
         box-shadow:0 8px 30px rgba(0,0,0,.1); }
  .icon { font-size:3rem; margin-bottom:14px; }
  h1 { font-size:1.15rem; color:#1B3358; margin-bottom:8px; }
  p { color:#6b7c7e; font-size:.9rem; line-height:1.7; margin-bottom:20px; }
  button { background:linear-gradient(135deg,#FF5733,#C43D1F); color:#fff; border:none;
           padding:11px 26px; border-radius:9px; font-family:inherit; font-size:.9rem;
           font-weight:700; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو إنك غير متصل بالشبكة حالياً. تحقق من اتصالك وحاول مرة أخرى.<br><span dir="ltr" style="font-size:.8rem">No internet connection. Please check your connection and try again.</span></p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
